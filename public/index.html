<!-- HERO SLIDER -->
<section id="home" class="hero">
    <div class="hero-bg"></div>
    <div class="hero-slider">
        <div class="hero-slides">
            
            <!-- HERO 1 - PENDEK & PADAT -->
            <div class="hero-slide active">
                <div class="hero-content">
                    <div class="hero-text">
                        <h1>OTP <span>Instan</span></h1>
                        <p>Verifikasi akun dalam hitungan detik</p>
                        <div class="hero-buttons">
                            <a href="#services" class="btn btn-primary">Mulai</a>
                            <a href="#pricing" class="btn btn-secondary">Harga</a>
                        </div>
                    </div>
                    <div class="hero-image">
                        <img src="/doo/hero1.png" alt="OTP Instan">
                    </div>
                </div>
            </div>
            
            <!-- HERO 2 - LAYANAN LENGKAP -->
            <div class="hero-slide">
                <div class="hero-content">
                    <div class="hero-text">
                        <h1>100+ <span>Layanan</span></h1>
                        <p>Games • Money • Utility • Sosial Media</p>
                        <div class="hero-buttons">
                            <a href="#services" class="btn btn-primary">Lihat</a>
                            <a href="#pricing" class="btn btn-secondary">Harga</a>
                        </div>
                    </div>
                    <div class="hero-image">
                        <img src="/doo/hero2.png" alt="Layanan Lengkap">
                    </div>
                </div>
            </div>
            
            <!-- HERO 3 - AMAN & CEPAT (TETAP) -->
            <div class="hero-slide">
                <div class="hero-content">
                    <div class="hero-text">
                        <h1>Aman & <span>Cepat</span></h1>
                        <p>Nomor virtual terjamin keamanannya</p>
                        <div class="hero-buttons">
                            <a href="#services" class="btn btn-primary">Mulai</a>
                            <a href="#contact" class="btn btn-secondary">Hubungi</a>
                        </div>
                    </div>
                    <div class="hero-image">
                        <img src="/doo/hero3.png" alt="Aman & Cepat">
                    </div>
                </div>
            </div>
            
        </div>
        
        <!-- Slider Controls -->
        <button class="slider-btn prev" onclick="changeSlide(-1)">❮</button>
        <button class="slider-btn next" onclick="changeSlide(1)">❯</button>
        <div class="slider-dots">
            <span class="dot active" onclick="goToSlide(0)"></span>
            <span class="dot" onclick="goToSlide(1)"></span>
            <span class="dot" onclick="goToSlide(2)"></span>
        </div>
    </div>
    
    <!-- Stats -->
    <div class="hero-stats">
        <div class="stat">
            <span class="stat-number" data-count="50">0</span>
            <span class="stat-label">Negara</span>
        </div>
        <div class="stat">
            <span class="stat-number" data-count="1000">0</span>
            <span class="stat-label">Nomor</span>
        </div>
        <div class="stat">
            <span class="stat-number" data-count="5000">0</span>
            <span class="stat-label">User</span>
        </div>
    </div>
</section>
